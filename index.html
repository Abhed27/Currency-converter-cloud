<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currency Converter</title>

<!-- 🛸 Futuristic Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ===============================
   🖱️ CUSTOM NEON CURSOR
=================================-->
<div class="cursor-dot"></div>
<div class="cursor-glow"></div>

<!-- ===============================
   🌍 WELCOME SCREEN
=================================-->

<div id="welcomeScreen" class="welcome-screen">
    <div class="welcome-box">
        <h1>👋 Welcome to Currency Converter</h1>
        <p>Convert global currencies instantly with live exchange rates 🚀</p>
        <button id="startBtn" class="start-btn">Start Converting →</button>
    </div>
</div>

<!-- ===============================
   🌍 MAIN APP
=================================-->

<div id="mainApp" class="hidden">

<div class="main-layout">

<!-- ===============================
   💱 CONVERTER BOX
=================================-->
<div class="container">

    <h2>🌍 Currency Converter</h2>

    <input type="number" id="amount" placeholder="Enter Amount">

    <div class="dropdown">

        <div class="select-container">
            <img id="from-flag" src="https://flagcdn.com/48x36/us.png">
            <select id="from">
                <option value="USD">USD</option>
                <option value="INR">INR</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="JPY">JPY</option>
                <option value="AUD">AUD</option>
                <option value="CAD">CAD</option>
                <option value="CNY">CNY</option>
            </select>
        </div>

        <div class="arrow" id="swap-btn" style="cursor: pointer; transition: 0.3s;" title="Swap Currencies">🔄</div>

        <div class="select-container">
            <img id="to-flag" src="https://flagcdn.com/48x36/in.png">
            <select id="to">
                <option value="INR">INR</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="JPY">JPY</option>
                <option value="AUD">AUD</option>
                <option value="CAD">CAD</option>
                <option value="CNY">CNY</option>
            </select>
        </div>

    </div>

    <!-- ⭐ IMPORTANT ID -->
    <button id="convert-btn">Convert</button>

    <!-- ⭐ RESULT OUTPUT -->
    <p id="result" class="msg">Result will appear here</p>

</div>


<!-- ===============================
   📊 HISTORY TABLE
=================================-->
<div class="history-panel">

    <h3>📊 Conversion History</h3>

    <table id="history-table">
        <thead>
            <tr>
                <th>From</th>
                <th>To</th>
                <th>Amount</th>
                <th>Result</th>
            </tr>
        </thead>

        <tbody>
        </tbody>
    </table>

</div>
</div>
</div>

<!-- ===============================
   🚀 START PAGE SCRIPT
=================================-->

<script>

const startBtn = document.getElementById("startBtn");
const welcomeScreen = document.getElementById("welcomeScreen");
const mainApp = document.getElementById("mainApp");

startBtn.addEventListener("click", () => {
    welcomeScreen.style.display = "none";
    mainApp.classList.remove("hidden");
});

</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
<script src="script.js"></script>

</body>
</html>
